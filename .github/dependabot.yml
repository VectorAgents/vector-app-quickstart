version: 2
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.PACKAGES_TOKEN }}
updates:
  - package-ecosystem: npm
    directories:
      - /packages/create-app
      - /templates/base
      - /templates/client-react/client
      - /templates/server-node/server
      - /templates/shared/shared
      - /recipes/*
    registries:
      - github-packages
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
