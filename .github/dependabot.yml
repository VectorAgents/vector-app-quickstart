version: 2
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.PACKAGES_TOKEN }}
updates:
  - package-ecosystem: npm
    directories:
      - /
      - /recipes/*
    registries:
      - github-packages
    schedule:
      interval: weekly
    groups:
      all:
        patterns: ["*"]
